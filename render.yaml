services:
  - type: web
    name: almotamayez
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /robots.txt
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
