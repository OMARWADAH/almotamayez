text x="340" y="410" font-size="30" font-family="Tajawal, 'IBM Plex Sans Arabic', Tahoma, sans-serif" font-weight="800" fill="#00838F" text-anchor="middle" transform="rotate(8 400 300)" opacity=".75">★</text><text x="460" y="410" font-size="30" font-family="Tajawal, 'IBM Plex Sans Arabic', Tahoma, sans-serif" font-weight="800" fill="#EC0B8C" text-anchor="middle" transform="rotate(8 400 300)" opacity=".75">M</text><text x="580" y="410" font-size="30" font-family="Tajawal, 'IBM Plex Sans Arabic', Tahoma, sans-serif" font-weight="800" fill="#00838F" text-anchor="middle" transform="rotate(8 400 300)" opacity=".75">★</text><rect x="230" y="510" width="340" height="56" rx="28" fill="#fff" filter="url(#sh)"/><text x="400" y="547" font-size="26.0" font-weight="800" fill="#111" text-anchor="middle" font-family="Tajawal, 'IBM Plex Sans Arabic', Tahoma, sans-serif" >ورق تغليف الطعام</text>
