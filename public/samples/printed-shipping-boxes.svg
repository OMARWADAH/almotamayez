<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="علب الشحن المطبوعة — نموذج توضيحي">
<defs>
<filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".18"/></filter>
<linearGradient id="gl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".35" stop-color="#fff" stop-opacity="0"/><stop offset=".55" stop-color="#fff" stop-opacity=".45"/><stop offset=".7" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a6a1f"/><stop offset=".45" stop-color="#f6dc8a"/><stop offset=".6" stop-color="#c79a2c"/><stop offset="1" stop-color="#7a5a14"/></linearGradient>
<linearGradient id="silver" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8d8d8d"/><stop offset=".5" stop-color="#f4f4f4"/><stop offset="1" stop-color="#9a9a9a"/></linearGradient>
<radialGradient id="glow" cx=".5" cy=".4" r=".7"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<radialGradient id="bgg" cx=".5" cy=".35" r=".8"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#FFF1E8"/></radialGradient>
<pattern id="holes" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="5" cy="5" r="2.2" fill="#FFF1E8"/></pattern>
<pattern id="holes2" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="3" fill="#000" opacity=".35"/></pattern>
</defs>
<rect width="800" height="600" fill="url(#bgg)"/>
<g filter="url(#sh)"><polygon points="220,250 540,250 654,164.5 334,164.5" fill="#D9B184"/><polygon points="540,250 654,164.5 654,364.5 540,450" fill="#A97C4E"/><rect x="220" y="250" width="320" height="200" fill="#C89B6A"/></g><polygon points="350,250 410,250 524,165 464,165" fill="#e9dcc8" opacity=".9"/><rect x="250" y="300" width="160" height="80" fill="#E8590C"/><text x="330" y="350" font-size="13.4" font-weight="800" fill="#fff" text-anchor="middle" font-family="Tajawal, 'IBM Plex Sans Arabic', Tahoma, sans-serif" >علب الشحن المطبوعة</text><text x="470" y="420" font-size="16.0" font-weight="800" fill="#3b2a17" text-anchor="middle" font-family="Tajawal, 'IBM Plex Sans Arabic', Tahoma, sans-serif" >FRAGILE</text>
<g><rect x="610" y="18" width="172" height="38" rx="19" fill="#111" opacity=".82"/><text x="696" y="44" font-size="18" font-weight="700" fill="#fff" text-anchor="middle" font-family="Tajawal, 'IBM Plex Sans Arabic', Tahoma, sans-serif">نموذج توضيحي</text></g>
